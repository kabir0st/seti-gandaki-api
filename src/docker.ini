[uwsgi]
base_dir = /app
module_dir = /app/src
chdir = %(module_dir)

module = core.wsgi:application
http = 0.0.0.0:8989

master = true
processes = 4
threads = 2
post-buffering = 204800
enable-threads = true

thunder-lock = true

socket-timeout = 300
reload-mercy = 8
reload-on-as = 512
harakiri = 50
max-requests = 5000
vacuum = true
disable-logging = true
touch-reload = %(base_dir)/src/core/
max-worker-lifetime = 300
logto = /app/logs_uwsgi.log
