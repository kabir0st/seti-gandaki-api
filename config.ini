[uwsgi]
username = ubuntu
uid = %(username)
gid = %(username)
project = seti-gandaki-api
for-readline = .env
  env = %(_)
endfor =

project_name = core

base_dir = /home/%(username)/%(project)/src

virtualenv = /home/%(username)/%(project)/.venv

chdir = %(base_dir)
for-readline = %(base_dir)/.env
  env = %(_)
endfor =
wsgi-file = %(base_dir)/core/wsgi.py
master = true
processes = 4
post-buffering = 204800
thunder-lock = True
uwsgi-socket = %(base_dir)/uwsgi.sock
# http = 0.0.0.0:8000
chmod-socket = 666
socket-timeout = 300
reload-mercy = 8
reload-on-as = 512
harakiri = 50
max-requests = 5000
vacuum = true
disable-logging = True
logto = %(base_dir)/logs/uwsgi.log
log-maxsize = 20971520
log-backupname = %(base_dir)/logs/backup-uwsgi.log
touch-reload = %(base_dir)/core/
max-worker-lifetime = 300