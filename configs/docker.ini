[uwsgi]
# Set user and group to run inside the container
uid = www-data
gid = www-data

# Paths adjusted to align with Docker container's structure
base_dir = /app
module_dir = %(base_dir)/src
virtualenv = %(base_dir)/.venv
chdir = %(module_dir)

# Application module
module = core.wsgi:application

# uWSGI settings
master = true
processes = 4
post-buffering = 204800

thunder-lock = true

# Socket setup
socket = /tmp/uwsgi.sock
chmod-socket = 666
socket-timeout = 300

# Reload and timeout settings
reload-mercy = 8
reload-on-as = 512
harakiri = 50
max-requests = 5000
vacuum = true
disable-logging = true

# Logging
logto = /var/log/uwsgi/uwsgi.log
log-maxsize = 20971520

# File watching for reload
touch-reload = %(module_dir)

# Worker lifecycle
max-worker-lifetime = 300
# Static and media file serving
static-map = /static=%(base_dir)/static
static-map = /media=%(base_dir)/media